<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Управление списком телефонных контактов (CRUD App)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">
      <i class="bi bi-person-lines-fill me-2"></i> Телефонная книга (REST API CRUD)
    </a>
    <span class="navbar-text text-white-50">
      NodeJS + Express + MongoDB
    </span>
  </div>
</nav>

<div class="container">
  <!-- Toast / Alerts -->
  <div id="alertPlaceholder"></div>

  <div class="row g-4">
    <!-- Левая колонка: Список контактов (ContactListComponent) -->
    <div class="col-md-5">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
          <h5 class="mb-0 fw-semibold text-secondary">
            <i class="bi bi-people me-1"></i> Список контактов
          </h5>
          <button class="btn btn-warning btn-sm fw-medium shadow-sm" id="btnNewContact">
            <i class="bi bi-plus-lg me-1"></i> Новый контакт
          </button>
        </div>
        <div class="card-body p-0">
          <ul class="list-group list-group-flush" id="contactList">
            <li class="list-group-item text-center text-muted py-4">
              <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
              Загрузка контактов...
            </li>
          </ul>
        </div>
        <div class="card-footer bg-white text-muted small py-2 d-flex justify-content-between">
          <span id="contactCount">Всего: 0</span>
          <button class="btn btn-link btn-sm text-danger text-decoration-none p-0" id="btnDeleteAll">
            <i class="bi bi-trash3 me-1"></i> Удалить все
          </button>
        </div>
      </div>
    </div>

    <!-- Правая колонка: Детали контакта (ContactDetailsComponent) -->
    <div class="col-md-7">
      <div class="card shadow-sm border-0" id="detailsCard">
        <div class="card-header bg-white py-3">
          <h5 class="mb-0 fw-semibold text-primary" id="formTitle">
            <i class="bi bi-person-badge me-1"></i> Детали контакта
          </h5>
        </div>
        <div class="card-body p-4">
          <form id="contactForm">
            <input type="hidden" id="contactId">

            <div class="mb-3">
              <label for="inputName" class="form-label fw-medium">Имя <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="inputName" placeholder="Например: Иван Иванов" required>
              </div>
            </div>

            <div class="mb-3">
              <label for="inputEmail" class="form-label fw-medium">Электронная почта</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="inputEmail" placeholder="user@mirea.ru">
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="inputPhoneMobile" class="form-label fw-medium">Мобильный телефон</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-phone"></i></span>
                  <input type="tel" class="form-control" id="inputPhoneMobile" placeholder="+7 (999) 000-00-00">
                </div>
              </div>
              <div class="col-md-6 mb-3">
                <label for="inputPhoneWork" class="form-label fw-medium">Рабочий телефон</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                  <input type="tel" class="form-control" id="inputPhoneWork" placeholder="8 (800) 200-00-00">
                </div>
              </div>
            </div>

            <hr class="my-4">

            <div class="d-flex justify-content-between align-items-center">
              <div>
                <button type="button" class="btn btn-primary px-4 fw-medium" id="btnSaveContact">
                  <i class="bi bi-check2-circle me-1"></i> <span id="saveBtnText">Создать контакт</span>
                </button>
                <button type="button" class="btn btn-outline-secondary ms-2" id="btnResetForm">
                  Отмена
                </button>
              </div>
              <button type="button" class="btn btn-outline-danger" id="btnDeleteContact" style="display: none;">
                <i class="bi bi-trash3 me-1"></i> Удалить
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
